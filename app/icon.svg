<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Superfície de Linho / Papel Nobre -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#F7F3EC" stroke="#E3D8C6" stroke-width="2" />

  <!-- Monograma / Ícone Delicado: Laço & Alfinete de Bebê Nobre -->
  <g transform="translate(50, 48)">
    <!-- Coração / Laço em Ouro Nobre Mate -->
    <path
      d="M 0, -14 
         C -12, -26 -28, -12 -18, 4 
         C -10, 16 0, 24 0, 24 
         C 0, 24 10, 16 18, 4 
         C 28, -12 12, -26 0, -14 Z"
      fill="none"
      stroke="#B38E5D"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Alfinete de Fralda Clássico em Carvão -->
    <circle cx="0" cy="-6" r="3.5" fill="#1C1917" />
    <path
      d="M 0, -3 L 0, 14"
      stroke="#1C1917"
      stroke-width="2.5"
      stroke-linecap="round"
    />
  </g>
</svg>
