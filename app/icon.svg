<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Arredondado Moderno -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" />

  <!-- Rostinho do Bebê / Touca de Bebê -->
  <g filter="url(#shadow)">
    <!-- Rostinho suave -->
    <circle cx="50" cy="50" r="28" fill="#FFFFFF" />

    <!-- Olhos fechadinhos dormindo feliz -->
    <path d="M 40 48 Q 43 53 46 48" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 54 48 Q 57 53 60 48" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" />

    <!-- Boquinha sorrindo -->
    <path d="M 47 57 Q 50 61 53 57" fill="none" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bochechas rosadas -->
    <circle cx="38" cy="54" r="3.5" fill="#FDA4AF" opacity="0.8" />
    <circle cx="62" cy="54" r="3.5" fill="#FDA4AF" opacity="0.8" />

    <!-- Chupeta charmosa ou Coraçãozinho Dourado na testa -->
    <path d="M 50 30 C 50 26 44 24 44 28 C 44 32 50 36 50 36 C 50 36 56 32 56 28 C 56 24 50 26 50 30 Z" fill="url(#heartGrad)" />
  </g>
</svg>
