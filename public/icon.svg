<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Máscara circular para os meridianos e paralelos não saírem fora do globo -->
    <clipPath id="globe-clip">
      <circle cx="0" cy="95" r="75" />
    </clipPath>
  </defs>

  <!-- Rotação invertida para 45 graus positivos -->
  <g transform="translate(250, 250) rotate(45)">
    
    <!-- 1. BICO DA CHUPETA -->
    <path d="M -30,-45 C -45,-80 -55,-130 0,-155 C 55,-130 45,-80 30,-45 Z" fill="#FFFFFF" stroke="#111111" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Brilho no bico (espelhado para a nova orientação) -->
    <path d="M -12,-140 C -26,-125 -28,-105 -24,-90" fill="none" stroke="#111111" stroke-width="8" stroke-linecap="round" />

    <!-- 2. BASE PROTETORA LABIAL (FORMA DE PÍLULA) -->
    <rect x="-95" y="-45" width="190" height="46" rx="23" fill="#D1D5DB" stroke="#111111" stroke-width="16" stroke-linejoin="round" />

    <!-- 3. CONECTOR ENTRE BASE E GLOBO -->
    <rect x="-24" y="0" width="48" height="28" rx="6" fill="#6B7280" stroke="#111111" stroke-width="14" stroke-linejoin="round" />

    <!-- 4. ARGOLA / GLOBO DA INTERNET -->
    <circle cx="0" cy="95" r="85" fill="none" stroke="#111111" stroke-width="14" />

    <circle cx="0" cy="95" r="75" fill="#FFFFFF" stroke="#111111" stroke-width="14" />

    <!-- Grelha da Internet recortada perfeitamente no globo -->
    <g clip-path="url(#globe-clip)" stroke="#111111" stroke-width="10" fill="none">
      <!-- Meridiano central vertical -->
      <line x1="0" y1="20" x2="0" y2="170" />
      
      <!-- Equador central horizontal -->
      <line x1="-75" y1="95" x2="75" y2="95" />
      
      <!-- Paralelos superior e inferior -->
      <line x1="-65" y1="65" x2="65" y2="65" />
      <line x1="-65" y1="125" x2="65" y2="125" />
      
      <!-- Meridianos curvados -->
      <ellipse cx="0" cy="95" rx="42" ry="75" />
    </g>

    <!-- Pormenor aberto da argola (espelhado para a nova orientação) -->
    <path d="M -68,148 A 86 86 0 0 0 25,180" fill="none" stroke="#111111" stroke-width="12" stroke-linecap="round" />
          
  </g>
</svg>