# ==============================================================================
# HARDENED NGINX REVERSE PROXY CONFIGURATION
# Standards: CIS Nginx Benchmark v1.0.0, Mozilla SSL Modern Profile, OWASP ASVS v4.0.3
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Oculta versão do Nginx (CWE-200 / Information Disclosure)
    server_tokens off;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Limites estritos de buffers contra DoS / Buffer Overflow
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Rate Limiting em memória (Proteção contra brute-force e DoS)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Formato de Logs Estruturado e Anonimização
    log_format main_secure '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for" '
                           'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log main_secure;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Redirecionamento forçado de HTTP para HTTPS (Porta 80 -> 443)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name fralda.online www.fralda.online;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS Seguro
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name fralda.online www.fralda.online;

        # Certificados SSL/TLS (Let's Encrypt / Cloudflare Origin)
        ssl_certificate /etc/ssl/certs/fralda_online.crt;
        ssl_certificate_key /etc/ssl/private/fralda_online.key;

        # Protocolos Modernos (Apenas TLS 1.2 e TLS 1.3 - Desativa SSLv3, TLS 1.0, TLS 1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # Otimização de Sessão SSL
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (Validação de revogação de certificado)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Hardening de Cabeçalhos de Segurança (Defense-in-Depth)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Bloqueio Imediato de Arquivos Ocultos (.git, .env, .htaccess)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Endpoints Críticos de Autenticação e Cartão (Rate Limit Restritivo)
        location ~ ^/(api/auth/login|api/auth/register|api/auth/forgot-password|api/orders/card) {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Demais Requisições (Proxy para Next.js)
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
